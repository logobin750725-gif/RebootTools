name: Build RELAXIN Respring V1.2 IPA
on:
  push:
    paths:
      - 'RELAXINRespringV12/**'
      - '.github/workflows/relaxin-v12.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Compile and package
        shell: bash
        run: |
          set -euo pipefail
          cd RELAXINRespringV12
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p Payload/RELAXINRespring.app
          xcrun swiftc -parse-as-library -target arm64-apple-ios15.0 -sdk "$SDK" -O -framework SwiftUI -framework UIKit Sources/App.swift -o Payload/RELAXINRespring.app/RELAXINRespring
          cp Info.plist Payload/RELAXINRespring.app/Info.plist
          plutil -lint Payload/RELAXINRespring.app/Info.plist
          codesign --force --sign - Payload/RELAXINRespring.app
          codesign --verify --verbose=2 Payload/RELAXINRespring.app
          zip -qr RELAXINRespring-V1.2-ADHOC.ipa Payload
          unzip -tq RELAXINRespring-V1.2-ADHOC.ipa
          file Payload/RELAXINRespring.app/RELAXINRespring
          shasum -a 256 RELAXINRespring-V1.2-ADHOC.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: RELAXINRespring-V1.2-ADHOC
          path: RELAXINRespringV12/RELAXINRespring-V1.2-ADHOC.ipa
          if-no-files-found: error
