name: Build RebootTools Chinese

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - name: Patch to Traditional Chinese
        run: |
          mkdir -p Resources/zh-Hant.lproj
          cat > Resources/zh-Hant.lproj/Localizable.strings << 'EOF'
          "Reboot Device" = "重啟設備";
          "Reboot Userspace" = "重啟用戶空間";
          "Respring" = "註銷";
          "RebootTools" = "重啟工具";
          "Settings" = "設定";
          "ENABLE FUNCTION" = "啟用功能";
          "TIMER" = "計時器";
          "ABOUT" = "關於";
          "Already installed via TrollStore" = "已透過 TrollStore 安裝";
          EOF
          # 把硬編碼的字串換成可本地化的，支援 .m .mm
          find . -type f \( -name "*.m" -o -name "*.mm" -o -name "*.swift" \) -exec sed -i '' 's/@"Reboot Device"/NSLocalizedString(@"Reboot Device", nil)/g' {} \; || find . -type f \( -name "*.m" -o -name "*.mm" \) -exec sed -i 's/@"Reboot Device"/NSLocalizedString(@"Reboot Device", nil)/g' {} \;
          find . -type f \( -name "*.m" -o -name "*.mm" \) -exec sed -i '' 's/@"Reboot Userspace"/NSLocalizedString(@"Reboot Userspace", nil)/g' {} \; || find . -type f \( -name "*.m" -o -name "*.mm" \) -exec sed -i 's/@"Reboot Userspace"/NSLocalizedString(@"Reboot Userspace", nil)/g' {} \;
          find . -type f \( -name "*.m" -o -name "*.mm" \) -exec sed -i '' 's/@"Respring"/NSLocalizedString(@"Respring", nil)/g' {} \; || find . -type f \( -name "*.m" -o -name "*.mm" \) -exec sed -i 's/@"Respring"/NSLocalizedString(@"Respring", nil)/g' {} \;

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git /opt/theos
          echo "THEOS=/opt/theos" >> $GITHUB_ENV
          echo "/opt/theos/bin" >> $GITHUB_PATH

      - name: Build IPA
        run: |
          export THEOS=/opt/theos
          make package FINALPACKAGE=1 PACKAGE_FORMAT=ipa THEOS_PACKAGE_SCHEME=rootless || make package FINALPACKAGE=1 PACKAGE_FORMAT=ipa

      - name: Convert to tipa
        run: |
          cd packages
          for f in *.ipa; do cp "$f" "${f%.ipa}.tipa"; done
          ls -lh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: RebootTools-Chinese-tipa
          path: packages/*
