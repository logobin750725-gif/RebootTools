name: Build RELAXIN Respring IPA
on:
  push:
    paths:
      - 'DopamineQuickActions/**'
      - 'entitlements.plist'
      - '.github/workflows/dopamine-ipa.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Verify fail-closed authorization gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          source = Path("DopamineQuickActions/DopamineActions.swift").read_text()
          required = [
              "official_channel_preflight",
              "channel=UNVERIFIED",
              "spawn=NOT_ATTEMPTED",
              "result=BLOCKED",
          ]
          forbidden = [
              r"\bposix_spawn\s*\(",
              r"\bexecve\s*\(",
              r"\bexecv\s*\(",
              r"(?<!\.)\bsystem\s*\(",
              r"\bkill\s*\(",
              r"\bkillall\s*\(",
              r"\bseteuid\s*\(",
              r"\bsetegid\s*\(",
              r"\bNSTask\b",
              r"\bProcess\s*\(",
          ]
          for item in required:
              assert item in source, f"Missing fail-closed marker: {item}"
          assert 'message: "BLOCKED：' in source
          # Strip ordinary Swift strings and line comments before scanning code.
          # Use the identical normalization for both real source and negative tests.
          def executable_code(text):
              without_strings = re.sub(r'"(?:\\.|[^"\\])*"', '""', text)
              return re.sub(r'//[^\n]*', '', without_strings)
          def has_forbidden(text):
              return any(re.search(pattern, executable_code(text)) for pattern in forbidden)
          assert not has_forbidden(source), "Unverified execution primitive in Swift source"
          assert has_forbidden(source + "\nfunc forbiddenProbe() { posix_spawn() }\n"), "Security gate missed executable spawn"
          assert not has_forbidden('let example = "posix_spawn()"\n'), "Security gate rejected diagnostic string"
          assert not has_forbidden('// posix_spawn()\n'), "Security gate rejected comment"
          assert not has_forbidden('Text("hello").font(.system(size: 11))\n'), "Security gate rejected SwiftUI font modifier"
          print("PASS: whole-source fail-closed gate and negative self-test")
          PY
      - name: Verify RELAXIN v0.5.5 release archive (independent of app build)
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          URL="https://github.com/5hux1n/relaxin/releases/download/v0.5.5/Relaxin-v0.5.5.ipa"
          EXPECTED="91398555cd74d64a70de7ddb1dcf49656372090f1e7e512a0be83eada662fae3"
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 180 --output /tmp/Relaxin-v0.5.5.ipa "$URL"
          echo "$EXPECTED  /tmp/Relaxin-v0.5.5.ipa" | shasum -a 256 --check
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          from plistlib import loads
          archive = Path("/tmp/Relaxin-v0.5.5.ipa")
          with ZipFile(archive) as z:
              names = z.namelist()
              apps = sorted({n.split("/")[1] for n in names if n.startswith("Payload/") and len(n.split("/")) > 2 and n.split("/")[1].endswith(".app")})
              assert apps, "Release IPA has no Payload/*.app"
              for app in apps:
                  info_name = f"Payload/{app}/Info.plist"
                  if info_name in names:
                      info = loads(z.read(info_name))
                      print("APP", app, "BUNDLE", info.get("CFBundleIdentifier"), "EXEC", info.get("CFBundleExecutable"))
              candidates = [n for n in names if "RelaxinPostJailbreak.framework/" in n or n.endswith("RLXPostJailbreakController.h")]
              print("RELAXIN_FRAMEWORK_CANDIDATES", len(candidates))
              dylibs = [n for n in names if n.endswith(".dylib")]
              frameworks = [n for n in names if ".framework/" in n]
              appex = [n for n in names if ".appex/" in n]
              print("BUNDLED_DYLIB_COUNT", len(dylibs))
              print("BUNDLED_FRAMEWORK_ENTRY_COUNT", len(frameworks))
              print("BUNDLED_EXTENSION_ENTRY_COUNT", len(appex))
              for n in dylibs[:35]:
                  print("BUNDLED_DYLIB", n)
              for n in frameworks[:35]:
                  print("BUNDLED_FRAMEWORK_ENTRY", n)
              for n in appex[:15]:
                  print("BUNDLED_EXTENSION_ENTRY", n)
              print("NOTE: archive filenames cannot prove exported symbols or third-party authorization")
              import subprocess
              import tempfile
              binary_name = "Payload/Relaxin.app/Frameworks/RelaxinEngine.framework/RelaxinEngine"
              if binary_name in names:
                  with tempfile.TemporaryDirectory() as d:
                      binary_path = Path(d) / "RelaxinEngine"
                      binary_path.write_bytes(z.read(binary_name))
                      for args in (["xcrun", "otool", "-L", str(binary_path)], ["xcrun", "nm", "-gU", str(binary_path)]):
                          result = subprocess.run(args, capture_output=True, text=True, check=False)
                          print("BINARY_INSPECT", args[1], "exit", result.returncode)
                          lines = result.stdout.splitlines()
                          print("BINARY_INSPECT_LINES", len(lines))
                          for line in lines:
                              if any(term.lower() in line.lower() for term in ("springboard", "respring", "postjailbreak", "restart", "xpc", "jailbreak")):
                                  print("SYMBOL_MATCH", line[:240])
                          if result.returncode:
                              print("BINARY_INSPECT_ERROR", result.stderr[:500])
              else:
                  print("BINARY_INSPECT_SKIPPED: RelaxinEngine executable not found")

              for n in candidates[:25]:
                  print("FRAMEWORK_FILE", n)
          print("PASS: downloaded v0.5.5 IPA hash matches release metadata and archive is readable")
          PY
      - name: Compile native iOS executable
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p Payload/DopamineQuickActions.app
          xcrun swiftc -parse-as-library -target arm64-apple-ios15.0 -sdk "$SDK" -O -framework SwiftUI -framework UIKit DopamineQuickActions/DopamineActions.swift -o Payload/DopamineQuickActions.app/DopamineQuickActions
          cat > Payload/DopamineQuickActions.app/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleExecutable</key><string>DopamineQuickActions</string>
          <key>CFBundleIdentifier</key><string>com.logobin.relaxinrespring</string>
          <key>CFBundleName</key><string>RELAXIN Respring</string>
          <key>CFBundleDisplayName</key><string>RELAXIN Respring</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleVersion</key><string>1</string>
          <key>CFBundleShortVersionString</key><string>0.1.0</string>
          <key>MinimumOSVersion</key><string>15.0</string>
          <key>UIDeviceFamily</key><array><integer>1</integer></array>
          <key>UILaunchScreen</key><dict/>
          </dict></plist>
          PLIST
          plutil -lint Payload/DopamineQuickActions.app/Info.plist
          plutil -lint entitlements.plist
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          requested = plistlib.loads(Path("entitlements.plist").read_bytes())
          assert requested == {}, f"Unexpected private entitlements requested: {sorted(requested)}"
          print("PASS: requested signing entitlements are empty")
          PY
          codesign --force --sign - --entitlements entitlements.plist Payload/DopamineQuickActions.app
          codesign --verify --verbose=2 Payload/DopamineQuickActions.app
          codesign -d --entitlements :- Payload/DopamineQuickActions.app > IPA-ENTITLEMENTS.plist 2>/dev/null
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          signed = plistlib.loads(Path("IPA-ENTITLEMENTS.plist").read_bytes())
          assert not signed, f"Unexpected signed entitlements: {sorted(signed)}"
          info = plistlib.loads(Path("Payload/DopamineQuickActions.app/Info.plist").read_bytes())
          assert info["CFBundleIdentifier"] == "com.logobin.relaxinrespring"
          assert info["CFBundleExecutable"] == "DopamineQuickActions"
          print("PASS: signed entitlements empty and app bundle metadata verified")
          PY
          zip -qr RELAXIN-Respring-ADHOC.ipa Payload
          unzip -t RELAXIN-Respring-ADHOC.ipa
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib
          import plistlib
          ipa = Path("RELAXIN-Respring-ADHOC.ipa")
          prefix = "Payload/DopamineQuickActions.app/"
          with ZipFile(ipa) as z:
              names = set(z.namelist())
              for name in (prefix + "Info.plist", prefix + "DopamineQuickActions", prefix + "_CodeSignature/CodeResources"):
                  assert name in names, f"Missing IPA payload: {name}"
              info = plistlib.loads(z.read(prefix + "Info.plist"))
              assert info["CFBundleIdentifier"] == "com.logobin.relaxinrespring"
              assert info["CFBundleExecutable"] == "DopamineQuickActions"
              embedded = hashlib.sha256(z.read(prefix + "DopamineQuickActions")).hexdigest()
          compiled = hashlib.sha256(Path(prefix + "DopamineQuickActions").read_bytes()).hexdigest()
          assert embedded == compiled, "Packaged executable differs from signed build"
          print("PASS: IPA contains expected app, code signature and identical executable")
          PY
          shasum -a 256 RELAXIN-Respring-ADHOC.ipa | tee IPA-SHA256.txt
          {
            echo "BUILD_COMMIT=${GITHUB_SHA}"
            echo "BUILD_RUN_ID=${GITHUB_RUN_ID}"
            echo "BUNDLE_ID=com.logobin.relaxinrespring"
            echo "TARGET=arm64-apple-ios15.0"
            echo "AUTHORIZATION_CHANNEL=UNVERIFIED"
            echo "RESPRING_FUNCTIONAL_STATUS=BLOCKED"
            echo "DEVICE_RESPRING_TEST=NOT_TESTED"
            echo "SIGNING=ADHOC"
          } | tee RELEASE-STATUS.txt
          if codesign -dv Payload/DopamineQuickActions.app 2> codesign-check.txt; then
            echo 'SIGNATURE=SIGNED' | tee SIGNATURE-STATUS.txt
          else
            echo 'SIGNATURE=UNVERIFIED' | tee SIGNATURE-STATUS.txt
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: RELAXIN-Respring-ADHOC
          if-no-files-found: error
          path: |
            RELAXIN-Respring-ADHOC.ipa
            IPA-SHA256.txt
            RELEASE-STATUS.txt
            SIGNATURE-STATUS.txt
            codesign-check.txt
            IPA-ENTITLEMENTS.plist
